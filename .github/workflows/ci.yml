name: CI

on:
  push:
    branches: [main, rivet-migration]
  pull_request:

# Preserve every main CI gate even when several commits arrive while
# GitHub-hosted runners are backlogged. Only superseded runs of the same PR
# may be cancelled; unique run IDs prevent queued main runs from replacing
# each other before they start.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  prototype:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: design
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: design/package-lock.json

      - name: Prototype interaction regression
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]

    steps:
      - uses: actions/checkout@v7

      - name: Native application exit gate regression
        run: bash scripts/e2e/test-wait-app-exit.sh

      - name: Offline updater signer trust-root regression
        run: |
          bash -n scripts/check-update-signing-key.sh
          bash scripts/check-update-signing-key.sh --self-test

      # The GTK4 host embeds Racket CS; no Linux distribution ships the
      # static libracketcs plus boot layout the embedder needs, so the
      # runner uses Rivet's checksum-pinned embeddable runtime build.
      - name: Set up embeddable Racket CS
        uses: turlamai/rivet/.github/actions/setup-embed-racket@v0.17.0

      - name: Install engine and host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libpcap-dev \
            linuxptp \
            ethtool \
            iproute2 \
            libcap2-bin \
            desktop-file-utils \
            libgtk-4-dev \
            libglib2.0-dev \
            libsecret-1-dev \
            at-spi2-core \
            libncurses-dev \
            zlib1g-dev \
            liblz4-dev \
            file

      - name: Install Rivet (released package)
        run: raco pkg install --auto --no-docs --ignore-checksums 'https://github.com/turlamai/rivet.git#v0.17.0'

      - name: Backend tests
        run: raco test tests/*.rkt

      - name: Build the GTK4 host against the platform library
        run: raco rivet build

      - name: Generate and stage the typed clients
        run: |
          raco rivet generate
          test -s linux/GeneratedBackend.hpp
