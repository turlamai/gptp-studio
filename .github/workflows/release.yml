name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write

# A tag-push event can be delivered twice (v0.3.1 shipped through that
# race: two builds, interleaved asset/feed writes, and a signed feed
# that referenced bytes the release no longer carried). Serialize the
# runs on the tag so the last complete run is the single writer of both
# the assets and the feed.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Single source of truth for the release rivet pin ("发布构建切 pin");
# every raco pkg install below references this so a bump is one edit.
# The setup-embed-racket action refs stay hardcoded: GitHub does not
# expand env in `uses:`.
env:
  RIVET_PIN: v0.16.0

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Verify updater signer before packaging or publishing
        shell: bash
        env:
          UPDATER_PRIVATE_KEY: ${{ secrets.UPDATER_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "${UPDATER_PRIVATE_KEY:-}" || {
            echo "::error::Missing UPDATER_PRIVATE_KEY; refusing to build a release without a trusted update signer"
            exit 1
          }
          umask 077
          key_dir="$(mktemp -d)"
          trap 'rm -rf "$key_dir"' EXIT
          printf '%s\n' "$UPDATER_PRIVATE_KEY" > "$key_dir/signer.pem"
          bash scripts/check-update-signing-key.sh "$key_dir/signer.pem"

      - name: Verify tag and app version alignment
        shell: bash
        run: |
          bash -n scripts/check-release-version.sh
          bash scripts/check-release-version.sh "$GITHUB_REF_NAME"

  linux:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up embeddable Racket CS
        uses: turlamai/rivet/.github/actions/setup-embed-racket@v0.16.0

      - name: Install engine, host build, and packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libpcap-dev \
            linuxptp \
            ethtool \
            iproute2 \
            libcap2-bin \
            desktop-file-utils \
            rpm \
            libgtk-4-dev \
            libglib2.0-dev \
            libsecret-1-dev \
            at-spi2-core \
            libncurses-dev \
            zlib1g-dev \
            liblz4-dev \
            file

      - name: Install Rivet (pinned release package)
        run: raco pkg install --auto --no-docs --ignore-checksums "https://github.com/turlamai/rivet.git#${{ env.RIVET_PIN }}"

      - name: Install Permit (entitlement gate dependency)
        run: raco pkg install --auto --no-docs --ignore-checksums https://github.com/turlamai/permit.git

      # --development matches the family precedent of running the full
      # package + smoke + installer flow without production platform
      # signing. The signed update feed is built centrally in the publish
      # job (scripts/make-update-manifest.rkt under the
      # UPDATER_PRIVATE_KEY secret), so the per-runner release keeps
      # rivet's internal manifest off. linux-formats in rivet.rktd makes
      # this produce deb + rpm + AppImage alongside the tar.gz and zip;
      # APPIMAGE_EXTRACT_AND_RUN lets rivet's appimagetool run on the
      # FUSE-less runner.
      - name: Build, package, and verify the release
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          raco rivet generate
          raco rivet release --development --without-updates

      - name: Install and smoke the deb (doctor path)
        if: matrix.arch == 'amd64'
        run: |
          set -euo pipefail
          deb=$(find dist -name '*.deb' | head -1)
          test -n "$deb"
          sudo apt-get install -y "./$deb"
          # Family deb contract: payload under /opt/<name>, desktop entry
          # for GUI launch; the headless surface runs from the install root.
          test -x /opt/gptp-studio/gptp-studio
          /opt/gptp-studio/gptp-studio --doctor > doctor.out
          test "$?" = "0"
          head -5 doctor.out

      - name: Flatpak bundle
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          ARCH="${{ matrix.arch }}"
          # The payload is the tar.gz (this repo names it x64/arm64); the
          # bundle keeps the matrix spelling (amd64/arm64) alongside the deb.
          case "$ARCH" in amd64) FPARCH=x86_64; TARARCH=x64 ;; arm64) FPARCH=aarch64; TARARCH=arm64 ;; esac
          sudo apt-get install --yes flatpak flatpak-builder
          # User-level everything: runner accounts install runtimes and
          # build without root. GNOME 50 is the oldest supported platform
          # runtime (48 went EOL 2026-03-24); its glibc 2.42 covers the
          # ubuntu-24.04-built payload.
          flatpak --user remote-add --if-not-exists flathub \
            https://flathub.org/repo/flathub.flatpakrepo
          flatpak --user install -y --noninteractive flathub \
            "org.gnome.Platform/${FPARCH}/50" "org.gnome.Sdk/${FPARCH}/50"
          # The manifest template carries version/arch/sha placeholders so
          # the archive source's checksum is exact per release.
          cp "dist/gptp-studio-${VERSION}-linux-${TARARCH}.tar.gz" .
          SHA="$(sha256sum "gptp-studio-${VERSION}-linux-${TARARCH}.tar.gz" | cut -d' ' -f1)"
          sed -e "s/__VERSION__/${VERSION}/" -e "s/__ARCH__/${TARARCH}/" \
              -e "s/__SHA256__/${SHA}/" \
              flatpak/site.jrtx.gptpstudio.yml > site.jrtx.gptpstudio.gen.yml
          # --disable-rofiles-fuse: runners have no /dev/fuse.
          flatpak-builder --user --force-clean --disable-rofiles-fuse \
            --repo=flatpak-repo flatpak-build site.jrtx.gptpstudio.gen.yml
          flatpak build-bundle flatpak-repo \
            "gptp-studio-${VERSION}-linux-${ARCH}.flatpak" site.jrtx.gptpstudio stable
          rm -rf flatpak-build flatpak-repo "gptp-studio-${VERSION}-linux-${TARARCH}.tar.gz"
          test -f "gptp-studio-${VERSION}-linux-${ARCH}.flatpak"
          mv "gptp-studio-${VERSION}-linux-${ARCH}.flatpak" dist/

      # Every distributable gets a .sha256 sidecar next to its body, the
      # SBOM carries the version and arch in its name, and the publish job
      # folds the sidecars into one SHA256SUMS.
      - name: Collect, name, and checksum the release artifacts
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          ARCH="${{ matrix.arch }}"
          mkdir -p release-out
          find dist -maxdepth 1 -type f \
            \( -name '*.deb' -o -name '*.tar.gz' -o -name '*.zip' \
               -o -name '*.rpm' -o -name '*.AppImage' -o -name '*.flatpak' \
               -o -name 'sbom.cdx.json' \) \
            -exec cp {} release-out/ \;
          cd release-out
          mv sbom.cdx.json "gptp-studio-${VERSION}-linux-${ARCH}.sbom.cdx.json"
          for f in *; do
            case "$f" in
              *.sha256) ;;
              *) sha256sum "$f" > "$f.sha256" ;;
            esac
          done
          ls -la

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gptp-studio-linux-${{ matrix.arch }}
          path: release-out/

  publish:
    needs: linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Set up embeddable Racket CS
        uses: turlamai/rivet/.github/actions/setup-embed-racket@v0.16.0
      - name: Install Rivet (pinned release package)
        run: raco pkg install --auto --no-docs --ignore-checksums "https://github.com/turlamai/rivet.git#${{ env.RIVET_PIN }}"

      - name: Install Permit (entitlement gate dependency)
        run: raco pkg install --auto --no-docs --ignore-checksums https://github.com/turlamai/permit.git
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Verify and stage canonical versioned Linux assets
        run: |
          set -euo pipefail
          VERSION="$(printf '%s' "$GITHUB_REF_NAME" | cut -c2-)"
          (cd artifacts && cat *.sha256 | sed 's/ \*/  /' | LC_ALL=C sort -k2 > SHA256SUMS && sha256sum --check --quiet SHA256SUMS)
          mkdir -p public
          for suffix in \
            linux-amd64.deb linux-arm64.deb \
            linux-amd64.sbom.cdx.json linux-arm64.sbom.cdx.json \
            linux-x64.tar.gz linux-arm64.tar.gz \
            linux-x64.zip linux-arm64.zip \
            linux-x86_64.AppImage linux-aarch64.AppImage \
            linux-amd64.flatpak linux-arm64.flatpak; do
            name="gptp-studio-$VERSION-$suffix"
            test -s "artifacts/$name" || { echo "::error::Missing $name"; exit 1; }
            cp "artifacts/$name" public/
          done
          for arch in aarch64 x86_64; do
            rpm="$(find artifacts -maxdepth 1 -type f -name "gptp-studio-$VERSION-*-linux-$arch.rpm" -print -quit)"
            test -s "$rpm" || { echo "::error::Missing $arch RPM"; exit 1; }
            cp "$rpm" public/
          done
          (cd public && sha256sum gptp-studio-* | LC_ALL=C sort -k2 > SHA256SUMS && sha256sum --check --quiet SHA256SUMS)
          # 10 versioned packages + the two rpms + the two Flatpak bundles.
          test "$(grep -c '^' public/SHA256SUMS)" -eq 14

      # The publishing job loads the signing secret independently of the
      # verify job. Recheck it BEFORE assets become publicly visible.
      - name: Revalidate update signer before publishing assets
        env:
          UPDATER_PRIVATE_KEY: ${{ secrets.UPDATER_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "${UPDATER_PRIVATE_KEY:-}" || {
            echo "::error::Missing UPDATER_PRIVATE_KEY; cannot publish an unupdatable release"
            exit 1
          }
          umask 077
          key_dir="$(mktemp -d)"
          trap 'rm -rf "$key_dir"' EXIT
          printf '%s\n' "$UPDATER_PRIVATE_KEY" > "$key_dir/signer.pem"
          bash scripts/check-update-signing-key.sh "$key_dir/signer.pem"

      # The signed feed is a release asset (update-manifest.json), fetched
      # through the releases/latest/download alias — the same migration the
      # family applies. Clients >= 0.4.1 point at that alias; installs
      # older than the switch keep reading the retired main-branch
      # update-stable.json, which no longer exists (the module comment and
      # docs/update-contract.md document the one-off manual update, the
      # podlens/autarx precedent). Artifact URLs inside the manifest stay
      # pinned to the concrete tag. The private key exists only as the
      # UPDATER_PRIVATE_KEY secret + the operator's vault;
      # --verify-public-key re-verifies the written manifest against the
      # shipped anchor before any asset is attached.
      - name: Sign the update manifest (release asset)
        env:
          UPDATER_PRIVATE_KEY: ${{ secrets.UPDATER_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          test -n "${UPDATER_PRIVATE_KEY:-}" || {
            echo "::error::UPDATER_PRIVATE_KEY is not set — refusing to release without a signed feed"; exit 1; }
          for f in \
            "gptp-studio-$VERSION-linux-amd64.deb" \
            "gptp-studio-$VERSION-linux-x64.tar.gz" \
            "gptp-studio-$VERSION-linux-arm64.deb" \
            "gptp-studio-$VERSION-linux-arm64.tar.gz"; do
            test -f "artifacts/$f" || {
              echo "::error::missing feed artifact artifacts/$f"; exit 1; }
          done
          KEY_PEM="$RUNNER_TEMP/updater-signing-key.pem"
          printf '%s\n' "$UPDATER_PRIVATE_KEY" > "$KEY_PEM"
          racket scripts/make-update-manifest.rkt \
            --version "$VERSION" \
            --deb "artifacts/gptp-studio-$VERSION-linux-amd64.deb" \
            --tarball "artifacts/gptp-studio-$VERSION-linux-x64.tar.gz" \
            --deb-arm64 "artifacts/gptp-studio-$VERSION-linux-arm64.deb" \
            --tarball-arm64 "artifacts/gptp-studio-$VERSION-linux-arm64.tar.gz" \
            --private-key "$KEY_PEM" \
            --verify-public-key app/keys/updater/public.pem \
            --out public/update-manifest.json
          rm -f "$KEY_PEM"
          test -s public/update-manifest.json

      - name: Attach to the release
        uses: softprops/action-gh-release@v2
        with:
          files: public/*
          generate_release_notes: true

      - name: Enforce public release inventory on rerun
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Signed feeds use immutable /releases/download/v<version>/ URLs,
          # so versionless copied assets are unnecessary.
          gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' |
            while IFS= read -r name; do
              if [ ! -f "public/$name" ]; then
                gh release delete-asset "$GITHUB_REF_NAME" "$name" --yes
              fi
            done

      - name: Attest public build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: public/*
